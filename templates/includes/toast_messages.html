{% load i18n %}
<!-- Global Toast Notification Container (UI/UX Pro Max) -->
<div id="pk-toast-container" class="pk-toast-container" role="region" aria-live="polite" aria-label="{% trans 'Notifications' %}"></div>

<!-- Server-side Django Messages Bridge -->
{% if messages %}
<div id="django-messages-data" style="display: none;">
  {% for message in messages %}
    <div data-message="{{ message|escapejs }}" data-tags="{% if 'error' in message.tags or 'danger' in message.tags %}error{% elif 'warning' in message.tags %}warning{% elif 'success' in message.tags %}success{% else %}info{% endif %}"></div>
  {% endfor %}
</div>
{% endif %}

<script>
(function() {
  'use strict';

  var SVG_ICONS = {
    success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>',
    error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>',
    warning: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>'
  };

  window.showToast = function(message, type, duration) {
    type = type || 'info';
    duration = duration || 5000;

    var container = document.getElementById('pk-toast-container');
    if (!container) {
      container = document.createElement('div');
      container.id = 'pk-toast-container';
      container.className = 'pk-toast-container';
      document.body.appendChild(container);
    }

    var toast = document.createElement('div');
    toast.className = 'pk-toast pk-toast-' + type;
    toast.setAttribute('role', 'alert');

    var iconWrapper = document.createElement('div');
    iconWrapper.className = 'pk-toast-icon';
    iconWrapper.innerHTML = SVG_ICONS[type] || SVG_ICONS.info;

    var body = document.createElement('div');
    body.className = 'pk-toast-body';
    body.textContent = message;

    var closeBtn = document.createElement('button');
    closeBtn.className = 'pk-toast-close';
    closeBtn.setAttribute('aria-label', 'Close');
    closeBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';

    var progressWrap = document.createElement('div');
    progressWrap.className = 'pk-toast-progress';
    var progressBar = document.createElement('div');
    progressBar.className = 'pk-toast-progress-bar';
    progressWrap.appendChild(progressBar);

    toast.appendChild(iconWrapper);
    toast.appendChild(body);
    toast.appendChild(closeBtn);
    toast.appendChild(progressWrap);

    container.appendChild(toast);

    var startTime = null;
    var timerId = null;
    var isPaused = false;

    function startProgress(time) {
      if (!startTime) startTime = time;
      var elapsed = time - startTime;
      var fraction = Math.max(0, 1 - (elapsed / duration));
      progressBar.style.transform = 'scaleX(' + fraction + ')';

      if (elapsed < duration) {
        if (!isPaused) {
          timerId = requestAnimationFrame(startProgress);
        }
      } else {
        dismiss();
      }
    }

    function dismiss() {
      if (toast.classList.contains('pk-toast-hide')) return;
      toast.classList.remove('pk-toast-show');
      toast.classList.add('pk-toast-hide');
      setTimeout(function() {
        if (toast.parentNode) {
          toast.parentNode.removeChild(toast);
        }
      }, 350);
    }

    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        toast.classList.add('pk-toast-show');
        timerId = requestAnimationFrame(startProgress);
      });
    });

    closeBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      if (timerId) cancelAnimationFrame(timerId);
      dismiss();
    });

    toast.addEventListener('mouseenter', function() {
      isPaused = true;
      if (timerId) cancelAnimationFrame(timerId);
    });

    toast.addEventListener('mouseleave', function() {
      if (isPaused) {
        isPaused = false;
        startTime = performance.now() - (duration * (1 - parseFloat(progressBar.style.transform.replace('scaleX(', '').replace(')', '') || 1)));
        timerId = requestAnimationFrame(startProgress);
      }
    });
  };

  document.addEventListener('DOMContentLoaded', function() {
    var msgBridge = document.getElementById('django-messages-data');
    if (msgBridge) {
      var items = msgBridge.querySelectorAll('div[data-message]');
      items.forEach(function(item, index) {
        var msg = item.getAttribute('data-message');
        var tags = item.getAttribute('data-tags') || 'info';
        if (msg) {
          setTimeout(function() {
            window.showToast(msg, tags, 5000);
          }, index * 250);
        }
      });
    }
  });
})();
</script>
