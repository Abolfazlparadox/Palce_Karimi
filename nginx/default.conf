# nginx/default.conf — Palace Karimi Reverse Proxy
# Upstream: Gunicorn on the internal Docker network

upstream django {
    server web:8000;
}

# Redirect HTTP → HTTPS (uncomment when SSL certificates are in place)
# server {
#     listen 80;
#     server_name example.com www.example.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name _;  # Replace with your domain in production

    charset utf-8;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;
    gzip_min_length 1024;

    client_max_body_size 20M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "unload=(self)" always;

    # Proxy headers — pass real client info to Django
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Static files — long browser cache
    location /static/ {
        alias /app/staticfiles/;
        expires max;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media uploads — moderate cache
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Health check endpoint for Docker / load balancer
    location /health/ {
        proxy_pass http://django;
        access_log off;
    }

    # Deny access to hidden files (e.g., .env, .git)
    location ~ /\. {
        deny all;
        return 404;
    }
}
