# =============================================================================
# nginx/default.conf — Palace Karimi Reverse Proxy
# Upstream: Gunicorn on internal Docker network
# =============================================================================

upstream django {
    server web:8000;
}

# ---------------------------------------------------------------------------
# HTTP server (port 80)
# When SSL is configured, uncomment the redirect block below and the
# HTTPS server block at the bottom.
# ---------------------------------------------------------------------------

# Redirect HTTP → HTTPS (uncomment when SSL certificates are in place)
# server {
#     listen 80;
#     server_name example.com www.example.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name _;  # Replace with your domain in production

    charset utf-8;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;
    gzip_min_length 1024;

    # Maximum upload size
    client_max_body_size 20M;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "unload=(self)" always;

    # Static files — served directly by Nginx
    # Uses moderate cache (1 day) since project doesn't use hashed filenames
    location /static/ {
        alias /app/staticfiles/;
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Media uploads — moderate cache
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Deny access to hidden files (e.g., .env, .git)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Proxy all other requests to Django/Gunicorn
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Timeouts for long requests
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }
}

