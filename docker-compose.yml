version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16
    container_name: palace_postgres
    restart: unless-stopped

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${DB_NAME:-palace_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-palace_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - palace_net

  # ---------------------------------------------------------------------------
  # Django + Gunicorn — Application
  # ---------------------------------------------------------------------------
  web:
    build: .
    container_name: palace_web
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/app/entrypoint.sh"]
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - palace_net

  # ---------------------------------------------------------------------------
  # Nginx — Reverse Proxy & Static Files
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: palace_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    networks:
      - palace_net

volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  palace_net:
    driver: bridge
